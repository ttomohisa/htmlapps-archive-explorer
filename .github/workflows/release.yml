name: Release Archive Explorer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: archive-explorer-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout merged version
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Build and verify standalone HTML
        shell: pwsh
        run: ./scripts/check-repository.ps1

      - name: Create version tag and GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content -LiteralPath app.config.json -Raw | ConvertFrom-Json).version
          if ($version -notmatch '^[0-9]+\.[0-9]+\.[0-9]+$') {
            throw "Invalid semantic version: $version"
          }
          $tag = "v$version"
          gh release view $tag --json tagName --jq .tagName 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists; skipping."
            exit 0
          }
          gh release create $tag "dist/index.html#archive-explorer.html" "dist/index.self-extract.html#archive-explorer-self-extract.html" --target $env:GITHUB_SHA --title $tag --generate-notes --latest
          if ($LASTEXITCODE -ne 0) {
            throw "Could not create release $tag"
          }
